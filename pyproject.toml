[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-to-skill"
version = "0.2.0"
description = "Convert videos into source-grounded, installable agent skills."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
video-to-skill = "video_to_skill.cli:main"

[project.optional-dependencies]
url = ["yt-dlp>=2025.1.1"]
transcribe = ["faster-whisper>=1.1.0"]
all = ["yt-dlp>=2025.1.1", "faster-whisper>=1.1.0"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
