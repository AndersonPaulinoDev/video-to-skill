<svg width="1500" height="750" viewBox="0 0 1500 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1500" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070A"/>
      <stop offset="0.52" stop-color="#080D12"/>
      <stop offset="1" stop-color="#06131A"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(420 375) rotate(90) scale(430 500)">
      <stop stop-color="#00E5FF" stop-opacity="0.2"/>
